<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Tool Haven — 本地运行的小工具合集：密码生成、JSON 格式化、汇率转换等。浏览器内完成，不上传敏感数据。" />
  <title>Tool Haven — 本地小工具合集</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4072143748973107"
     crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <script>
    (function () {
      var map = {
        "tool-password": "tools/password.html",
        "password": "tools/password.html",
        "tool-json": "tools/json.html",
        "json": "tools/json.html",
        "tool-currency": "tools/currency.html",
        "currency": "tools/currency.html",
        "tool-timestamp": "tools/timestamp.html",
        "timestamp": "tools/timestamp.html",
        "tool-base": "tools/base.html",
        "base": "tools/base.html"
      };
      var h = (location.hash || "").replace(/^#/, "");
      if (map[h]) location.replace(map[h]);
    })();
  </script>
  <div class="shell">
    <nav class="nav" aria-label="主导航">
      <a class="nav-brand" href="index.html">Tool Haven</a>
      <div class="nav-links">
        <a href="#catalog">浏览</a>
        <a href="#catalog">分类</a>
        <a href="#about">关于</a>
      </div>
    </nav>

    <header class="hero">
      <div>
        <h1 class="hero-brand">Tool Haven</h1>
        <p class="hero-line">几十个小工具，始终在本地。</p>
        <p class="hero-sub">密码、编码、格式化、取色——打开即用，不上传。</p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#catalog">浏览工具</a>
          <a class="btn btn-ghost" href="tools/password.html">密码生成器</a>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <span class="glyph glyph-a">••••••••</span>
        <span class="glyph glyph-b">#0F7A5A</span>
        <span class="glyph glyph-c">{ "ok": true }</span>
      </div>
    </header>

    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <div class="catalog-head">
        <div>
          <h2 id="catalog-title">全部工具</h2>
          <p>搜索名称，或按分类筛选。</p>
        </div>
        <label for="q" class="visually-hidden">搜索</label>
        <input class="search" id="q" type="search" placeholder="搜索工具…" autocomplete="off" />
      </div>

      <div class="filters" role="tablist" aria-label="分类">
        <button type="button" class="filter is-active" data-cat="all">全部</button>
        <button type="button" class="filter" data-cat="security">安全</button>
        <button type="button" class="filter" data-cat="dev">开发</button>
        <button type="button" class="filter" data-cat="convert">转换</button>
        <button type="button" class="filter" data-cat="pending">待开发</button>
      </div>

      <div class="meta">
        <span id="countLabel">0 个工具</span>
        <span>本地运行</span>
      </div>

      <div class="tool-grid" id="list"></div>
      <div class="empty" id="empty">没有匹配的工具，换个关键词试试。</div>
    </section>

    <footer id="about">Tool Haven · 工具留在你的设备上</footer>
  </div>

  <script>
    (function () {
      var tools = [
        { name: "Password Generator", desc: "本地生成强密码", cat: "security", live: true, href: "tools/password.html" },
        { name: "JSON Formatter", desc: "格式化、压缩与语法校验", cat: "dev", live: true, href: "tools/json.html" },
        { name: "Currency Converter", desc: "汇率换算，牌价本地缓存", cat: "convert", live: true, href: "tools/currency.html" },
        { name: "Timestamp Converter", desc: "按时区互转时间戳与日期", cat: "convert", live: true, href: "tools/timestamp.html" },
        { name: "Base Converter", desc: "二、八、十、十六进制互转", cat: "convert", live: true, href: "tools/base.html" },
        { name: "Hash Generator", desc: "MD5 / SHA 摘要", cat: "pending" },
        { name: "UUID Generator", desc: "生成唯一标识", cat: "pending" },
        { name: "Password Strength", desc: "评估密码强度", cat: "pending" },
        { name: "Text Diff", desc: "对比两段文本", cat: "pending" },
        { name: "Word Counter", desc: "字数与行数统计", cat: "pending" },
        { name: "Case Converter", desc: "大小写与命名风格", cat: "pending" },
        { name: "Lorem Ipsum", desc: "占位文案生成", cat: "pending" },
        { name: "Markdown Preview", desc: "即时预览 MD", cat: "pending" },
        { name: "Slugify", desc: "生成 URL 友好 slug", cat: "pending" },
        { name: "Base64 Encode", desc: "编码与解码", cat: "pending" },
        { name: "URL Encode", desc: "URL 编解码", cat: "pending" },
        { name: "Unit Converter", desc: "常用单位换算", cat: "pending" },
        { name: "Calculator", desc: "简洁计算器", cat: "pending" },
        { name: "JWT Decoder", desc: "解析 JWT 载荷", cat: "pending" },
        { name: "Regex Tester", desc: "正则快速验证", cat: "pending" },
        { name: "Cron Explainer", desc: "解读定时表达式", cat: "pending" },
        { name: "XML Formatter", desc: "整理 XML", cat: "pending" },
        { name: "QR Code Generator", desc: "文本转二维码", cat: "pending" },
        { name: "Color Picker", desc: "取色与色值转换", cat: "pending" },
        { name: "Image to Base64", desc: "图片转 Data URI", cat: "pending" },
        { name: "Favicon Generator", desc: "生成站点图标", cat: "pending" }
      ];
      var labels = { security: "安全", dev: "开发", convert: "转换", pending: "待开发" };
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var countLabel = document.getElementById("countLabel");
      var q = document.getElementById("q");
      var filters = Array.prototype.slice.call(document.querySelectorAll(".filter"));
      var activeCat = "all";

      function render() {
        var query = q.value.trim().toLowerCase();
        var filtered = tools.filter(function (t) {
          var hay = (t.name + " " + t.desc + " " + (labels[t.cat] || "")).toLowerCase();
          var catOk = activeCat === "all" || t.cat === activeCat;
          return catOk && (!query || hay.indexOf(query) !== -1);
        });
        filtered.sort(function (a, b) {
          return (b.live ? 1 : 0) - (a.live ? 1 : 0);
        });
        countLabel.textContent = filtered.length + " 个工具";
        list.innerHTML = "";
        empty.classList.toggle("is-on", filtered.length === 0);
        if (!filtered.length) {
          list.appendChild(empty);
          return;
        }
        filtered.forEach(function (t) {
          var el = document.createElement(t.live ? "a" : "button");
          el.className = "tool" + (t.live ? "" : " is-soon");
          if (t.live && t.href) el.href = t.href;
          else { el.type = "button"; el.disabled = true; }
          el.innerHTML =
            '<div><span class="tool-name">' + t.name + "</span>" +
            '<span class="tool-desc">' + t.desc + "</span></div>" +
            '<span class="tool-cat">' + labels[t.cat] + "</span>";
          list.appendChild(el);
        });
      }
      filters.forEach(function (btn) {
        btn.addEventListener("click", function () {
          activeCat = btn.getAttribute("data-cat");
          filters.forEach(function (b) { b.classList.toggle("is-active", b === btn); });
          render();
        });
      });
      q.addEventListener("input", render);
      render();
    })();
  </script>
</body>
</html>
