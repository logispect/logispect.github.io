<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="金额本地换算；仅在需要时拉取公开汇率表并缓存到本机。" />
  <title>Tool Haven — Currency Converter</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4072143748973107"
     crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="shell shell--tool">
    <header class="tool-hero">
      <a class="back-link" href="../index.html">← 返回首页</a>
      <h1>Currency Converter</h1>
      <p>金额本地换算；仅在需要时拉取公开汇率表并缓存到本机。</p>
    </header>

    <main aria-labelledby="fx-heading">
      <h2 id="fx-heading" class="visually-hidden">汇率转换</h2>
      <div class="fx-panel">
        <div class="fx-row">
          <label class="visually-hidden" for="fxAmountFrom">源金额</label>
          <input id="fxAmountFrom" type="text" inputmode="decimal" value="100" autocomplete="off" />
          <label class="visually-hidden" for="fxFrom">源货币</label>
          <select id="fxFrom" aria-label="源货币"></select>
        </div>
        <div class="fx-swap-wrap">
          <button type="button" class="btn btn-ghost" id="fxSwapBtn" aria-label="互换货币">⇄ 互换</button>
        </div>
        <div class="fx-row">
          <label class="visually-hidden" for="fxAmountTo">目标金额</label>
          <input id="fxAmountTo" type="text" inputmode="decimal" value="" autocomplete="off" />
          <label class="visually-hidden" for="fxTo">目标货币</label>
          <select id="fxTo" aria-label="目标货币"></select>
        </div>
      </div>
      <div class="fx-meta" id="fxMeta" data-state="loading" aria-live="polite">
        <span id="fxMetaText">正在获取汇率…</span>
      </div>
      <div class="fx-actions">
        <button type="button" class="btn btn-primary" id="fxRefreshBtn">刷新汇率</button>
      </div>
      <p class="hint">优先使用公开 CDN 汇率源（jsDelivr / open.er-api），失败时再尝试 Frankfurter。金额不会上传。</p>
    </main>

    <section class="faq">
      <h2>常见问题</h2>
      <details>
        <summary>金额会上传吗？</summary>
        <p>不会。换算在浏览器本地完成。网站只会请求公开汇率接口获取牌价。</p>
      </details>
      <details>
        <summary>汇率多久更新一次？</summary>
        <p>首次打开或缓存超过 12 小时会自动拉取；也可点击「刷新汇率」。牌价为公开市场参考价，非银行实时成交价。</p>
      </details>
      <details>
        <summary>离线能用吗？</summary>
        <p>若本机已有缓存汇率，可继续换算并提示数据可能过期；无缓存且无法联网时会显示错误。</p>
      </details>
    </section>
  </div>

  <script>
    (function () {
      var CACHE_KEY = "tool-haven-fx-v2";
      var CACHE_TTL_MS = 12 * 60 * 60 * 1000;
      var CURRENCIES = [
        { code: "USD", name: "美元" },
        { code: "CNY", name: "人民币" },
        { code: "EUR", name: "欧元" },
        { code: "JPY", name: "日元" },
        { code: "HKD", name: "港币" },
        { code: "GBP", name: "英镑" },
        { code: "AUD", name: "澳元" },
        { code: "CAD", name: "加元" },
        { code: "SGD", name: "新加坡元" },
        { code: "KRW", name: "韩元" },
        { code: "CHF", name: "瑞士法郎" },
        { code: "THB", name: "泰铢" },
        { code: "INR", name: "印度卢比" },
        { code: "NZD", name: "新西兰元" }
      ];
      var NEEDED = CURRENCIES.map(function (c) { return c.code; });
      var SOURCES = [
        {
          name: "jsDelivr",
          url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json",
          parse: function (json) {
            if (!json || !json.usd) return null;
            var rates = { USD: 1 };
            NEEDED.forEach(function (code) {
              var v = json.usd[code.toLowerCase()];
              if (typeof v === "number" && v > 0) rates[code] = v;
            });
            if (!rates.CNY) return null;
            return { base: "USD", date: json.date || "", rates: rates, provider: "jsDelivr" };
          }
        },
        {
          name: "open.er-api",
          url: "https://open.er-api.com/v6/latest/USD",
          parse: function (json) {
            if (!json || json.result !== "success" || !json.rates) return null;
            var rates = { USD: 1 };
            NEEDED.forEach(function (code) {
              var v = json.rates[code];
              if (typeof v === "number" && v > 0) rates[code] = v;
            });
            if (!rates.CNY) return null;
            return {
              base: "USD",
              date: json.time_last_update_utc || "",
              rates: rates,
              provider: "open.er-api"
            };
          }
        },
        {
          name: "Frankfurter",
          url: "https://api.frankfurter.app/latest?from=USD",
          parse: function (json) {
            if (!json || !json.rates) return null;
            var rates = Object.assign({ USD: 1 }, json.rates);
            return { base: json.base || "USD", date: json.date || "", rates: rates, provider: "Frankfurter" };
          }
        }
      ];

      var amountFrom = document.getElementById("fxAmountFrom");
      var amountTo = document.getElementById("fxAmountTo");
      var selectFrom = document.getElementById("fxFrom");
      var selectTo = document.getElementById("fxTo");
      var swapBtn = document.getElementById("fxSwapBtn");
      var refreshBtn = document.getElementById("fxRefreshBtn");
      var metaEl = document.getElementById("fxMeta");
      var metaText = document.getElementById("fxMetaText");
      var table = null;
      var editing = "from";
      var syncing = false;

      function fillSelects() {
        var html = CURRENCIES.map(function (c) {
          return '<option value="' + c.code + '">' + c.code + " · " + c.name + "</option>";
        }).join("");
        selectFrom.innerHTML = html;
        selectTo.innerHTML = html;
        selectFrom.value = "USD";
        selectTo.value = "CNY";
      }
      function setMeta(state, message) {
        metaEl.setAttribute("data-state", state);
        metaText.textContent = message;
      }
      function readCache() {
        try {
          var raw = localStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || !data.rates || !data.fetchedAt) return null;
          return data;
        } catch (_) { return null; }
      }
      function writeCache(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
      }
      function isFresh(data) {
        return data && Date.now() - data.fetchedAt < CACHE_TTL_MS;
      }
      function formatTime(ts) {
        try {
          return new Date(ts).toLocaleString("zh-CN", {
            month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
          });
        } catch (_) { return ""; }
      }
      function parseAmount(text) {
        if (text == null) return NaN;
        var cleaned = String(text).trim().replace(/,/g, "");
        if (!cleaned) return NaN;
        var n = Number(cleaned);
        return Number.isFinite(n) ? n : NaN;
      }
      function formatAmount(n) {
        if (!Number.isFinite(n)) return "";
        var abs = Math.abs(n);
        var digits = abs >= 1000 ? 2 : abs >= 1 ? 4 : 6;
        var s = n.toFixed(digits).replace(/\.?0+$/, "");
        if (s === "-0") s = "0";
        return s;
      }
      function getRate(code) {
        if (!table || !table.rates) return null;
        if (code === table.base) return 1;
        var r = table.rates[code];
        return typeof r === "number" && r > 0 ? r : null;
      }
      function convert(amount, from, to) {
        var rFrom = getRate(from);
        var rTo = getRate(to);
        if (rFrom == null || rTo == null) return NaN;
        return amount * (rTo / rFrom);
      }
      function unitRateText() {
        var one = convert(1, selectFrom.value, selectTo.value);
        if (!Number.isFinite(one)) return "";
        return "1 " + selectFrom.value + " ≈ " + formatAmount(one) + " " + selectTo.value;
      }
      function clearResult() {
        syncing = true;
        if (editing === "from") amountTo.value = "";
        else amountFrom.value = "";
        syncing = false;
      }
      function failMessage() {
        if (location.protocol === "file:") {
          return "本地 file 打开无法请求汇率接口。请用本地服务器或访问 https://logispect.github.io/tools/currency.html";
        }
        return "无法获取汇率，请检查网络后重试。";
      }
      function updateMetaOk(stale) {
        var parts = [unitRateText()];
        if (table.provider) parts.push(table.provider);
        if (table.date) parts.push("牌价 " + String(table.date).slice(0, 16));
        var when = formatTime(table.fetchedAt);
        if (when) parts.push((stale ? "缓存于 " : "更新于 ") + when);
        if (stale) parts.push("可能已过期");
        setMeta(stale ? "stale" : "ok", parts.filter(Boolean).join(" · "));
      }
      function recalc() {
        if (!table) { clearResult(); return; }
        syncing = true;
        if (editing === "from") {
          var a = parseAmount(amountFrom.value);
          amountTo.value = Number.isFinite(a) ? formatAmount(convert(a, selectFrom.value, selectTo.value)) : "";
        } else {
          var b = parseAmount(amountTo.value);
          amountFrom.value = Number.isFinite(b) ? formatAmount(convert(b, selectTo.value, selectFrom.value)) : "";
        }
        syncing = false;
        updateMetaOk(!isFresh(table));
      }
      async function fetchRates() {
        setMeta("loading", "正在获取汇率…");
        refreshBtn.disabled = true;
        try {
          for (var i = 0; i < SOURCES.length; i += 1) {
            var src = SOURCES[i];
            try {
              var res = await fetch(src.url, { cache: "no-store" });
              if (!res.ok) throw new Error("HTTP " + res.status);
              var parsed = src.parse(await res.json());
              if (!parsed || !parsed.rates || !parsed.rates.CNY) throw new Error("无效响应");
              table = {
                base: parsed.base,
                date: parsed.date,
                rates: parsed.rates,
                provider: parsed.provider,
                fetchedAt: Date.now()
              };
              writeCache(table);
              recalc();
              return;
            } catch (_) {}
          }
          var cached = readCache();
          if (cached) {
            table = cached;
            recalc();
            setMeta("stale", unitRateText() + " · 网络失败，使用缓存（" + formatTime(cached.fetchedAt) + "）");
            return;
          }
          table = null;
          clearResult();
          setMeta("bad", failMessage());
        } finally {
          refreshBtn.disabled = false;
        }
      }
      async function ensureRates(force) {
        var cached = readCache();
        if (!force && cached && isFresh(cached)) {
          table = cached;
          recalc();
          return;
        }
        if (!force && cached) {
          table = cached;
          recalc();
        }
        await fetchRates();
      }

      fillSelects();
      amountFrom.addEventListener("input", function () {
        if (syncing) return;
        editing = "from";
        recalc();
      });
      amountTo.addEventListener("input", function () {
        if (syncing) return;
        editing = "to";
        recalc();
      });
      selectFrom.addEventListener("change", function () { editing = "from"; recalc(); });
      selectTo.addEventListener("change", function () { editing = "from"; recalc(); });
      swapBtn.addEventListener("click", function () {
        var cf = selectFrom.value;
        selectFrom.value = selectTo.value;
        selectTo.value = cf;
        editing = "from";
        recalc();
      });
      refreshBtn.addEventListener("click", function () { ensureRates(true); });
      ensureRates(false);
    })();
  </script>
</body>
</html>
