<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="本地生成强密码，不会上传到任何服务器。" />
  <title>Tool Haven — Password Generator</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4072143748973107"
     crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="shell shell--tool">
    <header class="tool-hero">
      <a class="back-link" href="../index.html">← 返回首页</a>
      <h1>Password Generator</h1>
      <p>在浏览器本地生成强密码，不会上传到任何服务器。</p>
    </header>

    <main aria-labelledby="pw-heading">
      <h2 id="pw-heading" class="visually-hidden">密码生成器</h2>
      <div class="output-row">
        <label class="visually-hidden" for="passwordOut">生成的密码</label>
        <input id="passwordOut" type="text" readonly value="" spellcheck="false" autocomplete="off" placeholder="密码将显示在这里" />
        <button type="button" class="btn btn-copy" id="copyBtn">复制</button>
      </div>
      <div class="controls">
        <div class="control">
          <div class="control-label"><span>长度</span><strong id="lengthValue">16</strong></div>
          <input type="range" id="length" min="4" max="32" value="16" aria-label="密码长度" />
        </div>
        <fieldset class="control" style="border:0;margin:0;padding:0;">
          <legend class="control-label" style="padding:0;">字符集</legend>
          <div class="options">
            <label class="option"><input type="checkbox" id="uppercase" checked /><span>大写</span></label>
            <label class="option"><input type="checkbox" id="lowercase" checked /><span>小写</span></label>
            <label class="option"><input type="checkbox" id="numbers" checked /><span>数字</span></label>
            <label class="option"><input type="checkbox" id="symbols" checked /><span>符号</span></label>
          </div>
        </fieldset>
        <div>
          <p class="error" id="error" role="alert"></p>
          <button type="button" class="btn btn-generate" id="generateBtn">生成密码</button>
        </div>
      </div>
      <p class="hint">使用 <code>crypto.getRandomValues</code> 生成安全随机数。</p>
    </main>

    <section class="faq">
      <h2>常见问题</h2>
      <details>
        <summary>密码会发送到服务器吗？</summary>
        <p>不会。生成与复制都在你的浏览器本地完成。</p>
      </details>
      <details>
        <summary>建议用多长？</summary>
        <p>一般账号建议 16 位以上，并混用多种字符集；每个网站使用不同密码。</p>
      </details>
    </section>
  </div>

  <script>
    (function () {
      var UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      var LOWER = "abcdefghijklmnopqrstuvwxyz";
      var NUMBERS = "0123456789";
      var SYMBOLS = "!@#$%^&*()-_=+[]{}|;:,.<>?/~";
      var lengthInput = document.getElementById("length");
      var lengthValue = document.getElementById("lengthValue");
      var passwordInput = document.getElementById("passwordOut");
      var generateBtn = document.getElementById("generateBtn");
      var copyBtn = document.getElementById("copyBtn");
      var errorEl = document.getElementById("error");
      var charsetToggles = {
        uppercase: document.getElementById("uppercase"),
        lowercase: document.getElementById("lowercase"),
        numbers: document.getElementById("numbers"),
        symbols: document.getElementById("symbols")
      };
      var copyResetTimer = null;

      function setError(message) {
        errorEl.textContent = message || "";
        errorEl.classList.toggle("is-visible", Boolean(message));
      }
      function getCharset() {
        var pool = "";
        if (charsetToggles.uppercase.checked) pool += UPPER;
        if (charsetToggles.lowercase.checked) pool += LOWER;
        if (charsetToggles.numbers.checked) pool += NUMBERS;
        if (charsetToggles.symbols.checked) pool += SYMBOLS;
        return pool;
      }
      function secureRandomIndex(maxExclusive) {
        if (!window.crypto || typeof window.crypto.getRandomValues !== "function") {
          throw new Error("当前浏览器无法使用安全随机数。");
        }
        var limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
        var buf = new Uint32Array(1);
        var value;
        do {
          window.crypto.getRandomValues(buf);
          value = buf[0];
        } while (value >= limit);
        return value % maxExclusive;
      }
      function generatePassword(length, pool) {
        var result = "";
        for (var i = 0; i < length; i += 1) result += pool[secureRandomIndex(pool.length)];
        return result;
      }
      function syncLengthDisplay() { lengthValue.textContent = lengthInput.value; }
      function onGenerate() {
        setError("");
        var pool = getCharset();
        if (!pool) {
          passwordInput.value = "";
          setError("请至少选择一种字符集。");
          return;
        }
        try {
          passwordInput.value = generatePassword(Number(lengthInput.value), pool);
        } catch (err) {
          passwordInput.value = "";
          setError(err.message || "生成失败。");
        }
      }
      async function onCopy() {
        var value = passwordInput.value;
        if (!value) {
          setError("请先生成密码再复制。");
          return;
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(value);
          } else {
            passwordInput.focus();
            passwordInput.select();
            if (!document.execCommand("copy")) throw new Error("copy failed");
          }
          copyBtn.textContent = "已复制";
          copyBtn.classList.add("is-success");
          clearTimeout(copyResetTimer);
          copyResetTimer = setTimeout(function () {
            copyBtn.textContent = "复制";
            copyBtn.classList.remove("is-success");
          }, 1600);
          setError("");
        } catch (_) {
          setError("复制失败，请手动选择密码复制。");
        }
      }
      lengthInput.addEventListener("input", syncLengthDisplay);
      generateBtn.addEventListener("click", onGenerate);
      copyBtn.addEventListener("click", onCopy);
      Object.keys(charsetToggles).forEach(function (key) {
        charsetToggles[key].addEventListener("change", function () {
          if (getCharset()) setError("");
        });
      });
      syncLengthDisplay();
      onGenerate();
    })();
  </script>
</body>
</html>
