<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="小小冰淇淋店：给小朋友点一点，做一份冰淇淋。本地运行，不上传。" />
  <title>小小冰淇淋店</title>
  <style>
    :root {
      --ink: #5a3828;
      --muted: #a88472;
      --cream: #fff8ee;
      --peach: #ffd7a8;
      --card: #fff;
      --shadow: #f0c49a;
      --pink: #ff8eab;
      --mango: #ffb703;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--peach);
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 440px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 12px 16px max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--cream) 0%, #ffe7c4 100%);
    }

    .app [hidden] { display: none !important; }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        height: min(860px, 100dvh);
        min-height: 0;
        border-radius: 32px;
        overflow: auto;
        box-shadow: 0 16px 40px rgba(180, 100, 40, 0.18);
      }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .icon-btn {
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 4px 0 var(--shadow);
      color: var(--ink);
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .icon-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
    .icon-btn { touch-action: manipulation; }
    .icon-btn svg { width: 32px; height: 32px; display: block; }
    .icon-btn .slash { display: none; }
    .icon-btn.is-off .slash { display: block; }
    .icon-btn.is-off .wave { display: none; }

    .dots {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f3dcc4;
    }

    .dot.is-done { background: var(--pink); }
    .dot.is-now { background: var(--mango); transform: scale(1.3); }

    .prompt {
      margin: 10px 0 0;
      text-align: center;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      min-height: 2.4rem;
    }

    .stage {
      flex: 1;
      min-height: 230px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      padding: 12px 0 8px;
    }

    .bear {
      position: absolute;
      left: 0;
      bottom: 4px;
      width: 118px;
      transition: transform 0.35s ease;
    }

    .bear svg { width: 100%; height: auto; display: block; }
    .bear .mouth-happy,
    .bear .eyes-happy { display: none; }
    .bear.is-happy { transform: translateY(-8px) scale(1.05); }
    .bear.is-happy .mouth-wait,
    .bear.is-happy .eyes-wait { display: none; }
    .bear.is-happy .mouth-happy,
    .bear.is-happy .eyes-happy { display: block; }

    .treat-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-left: 48px;
      transition: transform 0.35s ease;
    }

    .is-looking .treat-wrap { transform: scale(1.12); }

    .treat {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 180px;
      justify-content: flex-end;
    }

    .treat.is-done { animation: celebrate 0.7s ease; }

    .treat-svg {
      width: 210px;
      height: auto;
      display: block;
      overflow: visible;
      animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.36, 1);
    }

    .choices.is-colors { grid-template-columns: 1fr 1fr 1fr; }
    .choices.is-colors .choice {
      min-height: 84px;
      font-size: 0.92rem;
      padding: 6px 4px;
    }

    .treat.is-done .treat-svg { animation: celebrate 0.7s ease; }

    .plate {
      width: 170px;
      height: 16px;
      margin-top: -6px;
      border-radius: 50%;
      background: rgba(232, 164, 104, 0.35);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice {
      appearance: none;
      border: 3px solid transparent;
      background: var(--card);
      border-radius: 24px;
      min-height: 112px;
      padding: 10px 8px 8px;
      box-shadow: 0 8px 0 var(--shadow);
      cursor: pointer;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .choice:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--shadow); }
    .choice.is-picked {
      border-color: var(--pink);
      transform: scale(1.04);
    }

    .choice .art { width: 88px; height: 68px; display: grid; place-items: center; }
    .choice .art svg { width: 100%; height: 100%; }

    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .footer.is-single { grid-template-columns: 1fr; }

    .go {
      appearance: none;
      border: 0;
      border-radius: 20px;
      min-height: 64px;
      background: var(--card);
      box-shadow: 0 5px 0 var(--shadow);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      font-size: 1.15rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }

    .go-again {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 5px 0 #e56b8c;
      font-size: 1.35rem;
    }

    @keyframes pop {
      from { transform: translateY(16px) scale(0.7); }
      to { transform: none; }
    }

    @keyframes drop {
      from { transform: translateY(-18px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    @media (max-height: 760px) {
      .app { padding: 8px 12px max(12px, env(safe-area-inset-bottom)); }
      .prompt { margin-top: 4px; font-size: 1.4rem; min-height: 2rem; }
      .stage { min-height: 0; padding: 0; }
      .treat { min-height: 0; }
      .treat-svg { width: 158px; }
      .choices.is-colors .choice { min-height: 72px; }
      .bear { width: 92px; }
      .choice { min-height: 88px; }
      .footer { margin-top: 8px; }
    }

    @keyframes celebrate {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .treat-svg, .treat.is-done .treat-svg { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="icon-btn" href="../index.html" aria-label="回家">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path fill="currentColor" d="M6 14.5 16 6l10 8.5V26a2 2 0 0 1-2 2h-5.2v-7.2h-5.6V28H8a2 2 0 0 1-2-2V14.5Z"/>
        </svg>
      </a>
      <div class="dots" id="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="声音开">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path fill="currentColor" d="M6 12h5l7-5v18l-7-5H6V12Z"/>
          <path class="wave" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M22 12c2 1.6 2 6.4 0 8M24.5 9c3.2 2.6 3.2 11.4 0 14"/>
          <path class="slash" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M22 10 28 22"/>
        </svg>
      </button>
    </header>

    <p class="prompt" id="prompt" aria-live="polite">选一个容器</p>

    <div class="stage" id="stage">
      <div class="bear" id="bear" aria-hidden="true">
        <svg viewBox="0 0 140 156">
          <circle cx="34" cy="42" r="22" fill="#e7b184"/>
          <circle cx="106" cy="42" r="22" fill="#e7b184"/>
          <circle cx="34" cy="42" r="12" fill="#f7c3cf"/>
          <circle cx="106" cy="42" r="12" fill="#f7c3cf"/>
          <circle cx="70" cy="86" r="48" fill="#f6c7a2"/>
          <ellipse cx="70" cy="100" rx="22" ry="16" fill="#fde6d6"/>
          <g class="eyes-wait">
            <ellipse cx="52" cy="78" rx="7" ry="8" fill="#3a2a24"/>
            <ellipse cx="88" cy="78" rx="7" ry="8" fill="#3a2a24"/>
            <circle cx="54.5" cy="75" r="2.4" fill="#fff"/>
            <circle cx="90.5" cy="75" r="2.4" fill="#fff"/>
          </g>
          <g class="eyes-happy" fill="none" stroke="#3a2a24" stroke-width="3.4" stroke-linecap="round">
            <path d="M44 80 Q52 70 60 80"/>
            <path d="M80 80 Q88 70 96 80"/>
          </g>
          <ellipse cx="70" cy="96" rx="5" ry="3.5" fill="#e7a08c"/>
          <path class="mouth mouth-wait" d="M58 108 Q70 116 82 108" fill="none" stroke="#3a2a24" stroke-width="3.2" stroke-linecap="round"/>
          <path class="mouth mouth-happy" d="M54 104 Q70 124 86 104" fill="none" stroke="#3a2a24" stroke-width="3.2" stroke-linecap="round"/>
          <ellipse cx="36" cy="98" rx="9" ry="5.5" fill="#ffb4c6" opacity="0.85"/>
          <ellipse cx="104" cy="98" rx="9" ry="5.5" fill="#ffb4c6" opacity="0.85"/>
        </svg>
      </div>
      <div class="treat-wrap">
        <div class="treat" id="treat"></div>
        <div class="plate"></div>
      </div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="footer" id="playFooter">
      <button type="button" class="go" id="backBtn">上一步</button>
      <button type="button" class="go" id="resetBtn">重来</button>
    </div>
    <div class="footer" id="doneFooter" hidden>
      <button type="button" class="go go-again" id="againBtn">再做一份</button>
      <button type="button" class="go" id="lookBtn">看一看</button>
    </div>
  </div>

  <script>
    (function () {
      var phase = "container";
      var state = { container: null, pendingShape: null, scoops: [], toppings: [] };
      var history = [];
      var looking = false;
      var soundOn = true;
      var booted = false;
      var busy = false;
      var ctx = null;

      var promptEl = document.getElementById("prompt");
      var treatEl = document.getElementById("treat");
      var choicesEl = document.getElementById("choices");
      var dots = document.querySelectorAll(".dot");
      var bear = document.getElementById("bear");
      var app = document.getElementById("app");
      var playFooter = document.getElementById("playFooter");
      var doneFooter = document.getElementById("doneFooter");
      var backBtn = document.getElementById("backBtn");
      var resetBtn = document.getElementById("resetBtn");
      var againBtn = document.getElementById("againBtn");
      var lookBtn = document.getElementById("lookBtn");
      var soundBtn = document.getElementById("soundBtn");

      var MAX_SCOOPS = 3;
      var groups = {
        container: [
          { id: "cone", label: "甜筒" },
          { id: "cup", label: "杯子" }
        ],
        shape: [
          { id: "ball", label: "圆球" },
          { id: "swirl", label: "花卷" }
        ],
        color: [
          { id: "strawberry", label: "草莓" },
          { id: "mango", label: "芒果" },
          { id: "vanilla", label: "香草" },
          { id: "chocolate", label: "巧克力" },
          { id: "matcha", label: "抹茶" },
          { id: "blueberry", label: "蓝莓" }
        ],
        topping: [
          { id: "cherry", label: "樱桃" },
          { id: "sauce", label: "巧克力酱" },
          { id: "sprinkles", label: "彩虹糖" }
        ],
        more: [
          { id: "add", label: "再加一个" },
          { id: "next", label: "加配料" }
        ],
        moreTop: [
          { id: "add", label: "再加配料" },
          { id: "finish", label: "做好啦" }
        ]
      };

      function promptFor(name) {
        if (name === "container") return "选一个容器";
        if (name === "shape") return "选一个形状";
        if (name === "color") return "选一个颜色";
        if (name === "more") return "还要再加吗";
        if (name === "topping") return "选一个配料";
        if (name === "moreTop") return "还要配料吗";
        return "做好啦";
      }

      function phaseIndex(name) {
        if (name === "container") return 0;
        if (name === "shape" || name === "more") return 1;
        if (name === "color") return 2;
        if (name === "topping" || name === "moreTop") return 3;
        return 4;
      }

      function remember() {
        history.push(JSON.stringify({
          phase: phase,
          container: state.container,
          pendingShape: state.pendingShape,
          scoops: state.scoops,
          toppings: state.toppings
        }));
      }

      function restore(raw) {
        var saved = JSON.parse(raw);
        phase = saved.phase;
        state.container = saved.container;
        state.pendingShape = saved.pendingShape;
        state.scoops = saved.scoops;
        state.toppings = saved.toppings;
      }

      var svgN = 0;
      function uid(prefix) {
        svgN += 1;
        return prefix + svgN;
      }

      function scoopColors(flavor) {
        if (flavor === "chocolate") return ["#e7c2a4", "#a56b45", "#6d4030"];
        if (flavor === "vanilla") return ["#fffdf8", "#f4e4c8", "#e7d3ae"];
        if (flavor === "mango") return ["#ffe9ad", "#ffc44d", "#f0a31e"];
        if (flavor === "matcha") return ["#e7f6cf", "#8fce6a", "#5ea246"];
        if (flavor === "blueberry") return ["#e4d4ff", "#a78bfa", "#7c5cbf"];
        return ["#ffe4ee", "#ff8eab", "#f26b90"];
      }

      function grad(id, flavor) {
        var colors = scoopColors(flavor);
        return '<radialGradient id="' + id + '" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="' + colors[0] + '"/><stop offset="0.62" stop-color="' + colors[1] + '"/><stop offset="1" stop-color="' + colors[2] + '"/></radialGradient>';
      }

      function ballMarks(flavor, cx, cy, rx, ry) {
        function at(ox, oy) { return { x: cx + ox * rx, y: cy + oy * ry }; }
        if (flavor === "strawberry") {
          var seeds = [[-0.22, 0.08], [0.2, 0.16], [0.02, 0.32], [-0.08, -0.08]];
          return seeds.map(function (p) {
            var q = at(p[0], p[1]);
            return '<ellipse cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" rx="3" ry="4.4" fill="#ffe0c2"/>';
          }).join("");
        }
        if (flavor === "chocolate") {
          var chips = [[-0.22, 0.02, -18], [0.24, 0.2, 16]];
          return chips.map(function (p) {
            var q = at(p[0], p[1]);
            return '<ellipse cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" rx="6" ry="3.4" fill="#3d2418" transform="rotate(' + p[2] + " " + q.x.toFixed(1) + " " + q.y.toFixed(1) + ')"/>';
          }).join("");
        }
        if (flavor === "vanilla") {
          var a = at(-0.28, 0.02);
          var b = at(0.28, 0.08);
          var c = at(0, -0.28);
          return '<path d="M' + a.x.toFixed(1) + " " + a.y.toFixed(1) + " Q " + c.x.toFixed(1) + " " + c.y.toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1) + '" fill="none" stroke="#f0d7a8" stroke-width="4" stroke-linecap="round"/>';
        }
        if (flavor === "matcha") {
          var leaf = at(0.16, -0.1);
          return '<ellipse cx="' + leaf.x.toFixed(1) + '" cy="' + leaf.y.toFixed(1) + '" rx="8" ry="4" fill="#d9f5b8" transform="rotate(-30 ' + leaf.x.toFixed(1) + " " + leaf.y.toFixed(1) + ')"/>';
        }
        if (flavor === "blueberry") {
          var dots = [[-0.16, 0.1], [0.18, 0.18], [0.02, 0.28]];
          return dots.map(function (p) {
            var q = at(p[0], p[1]);
            return '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="3.2" fill="#6d4bb5"/>';
          }).join("");
        }
        var blush = at(0.18, -0.12);
        return '<ellipse cx="' + blush.x.toFixed(1) + '" cy="' + blush.y.toFixed(1) + '" rx="' + (rx * 0.22).toFixed(1) + '" ry="' + (ry * 0.16).toFixed(1) + '" fill="#ffe9a8" opacity="0.7"/>';
      }

      function ballMarkup(id, flavor, cx, cy, rx, ry) {
        var gid = id + "b" + Math.round(cy);
        return grad(gid, flavor)
          + '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="url(#' + gid + ')"/>'
          + '<ellipse cx="' + (cx - rx * 0.32).toFixed(1) + '" cy="' + (cy - ry * 0.36).toFixed(1) + '" rx="' + (rx * 0.26).toFixed(1) + '" ry="' + (ry * 0.2).toFixed(1) + '" fill="#fff" opacity="0.42"/>'
          + ballMarks(flavor, cx, cy, rx, ry);
      }

      function swirlMarkup(id, flavor, baseY, topY) {
        var gid = id + "w" + Math.round(baseY);
        var h = baseY - topY;
        function pt(px, py) {
          return (46 + px * 1.08).toFixed(1) + " " + (topY + py / 100 * h).toFixed(1);
        }
        var d = "M " + pt(28, 94)
          + " C " + pt(6, 72) + " " + pt(16, 50) + " " + pt(36, 42)
          + " C " + pt(14, 34) + " " + pt(20, 16) + " " + pt(42, 8)
          + " C " + pt(54, 1) + " " + pt(66, 10) + " " + pt(58, 24)
          + " C " + pt(80, 14) + " " + pt(94, 38) + " " + pt(74, 52)
          + " C " + pt(98, 62) + " " + pt(92, 84) + " " + pt(66, 94)
          + " C " + pt(54, 100) + " " + pt(40, 100) + " " + pt(28, 94) + " Z";
        var ridge = "M " + pt(50, 86) + " C " + pt(34, 62) + " " + pt(66, 40) + " " + pt(48, 16);
        return grad(gid, flavor)
          + '<path d="' + d + '" fill="url(#' + gid + ')"/>'
          + '<path d="' + ridge + '" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>';
      }

      function layoutScoops() {
        var seat = 206;
        var cursorTop = seat - 8;
        var items = [];
        state.scoops.forEach(function (scoop, index) {
          if (scoop.shape === "swirl") {
            var height = index === 0 ? 156 : 118;
            var base = index === 0 ? seat + 6 : cursorTop + 18;
            var top = base - height;
            items.push({ type: "swirl", flavor: scoop.flavor, base: base, top: top, cx: 100 });
            cursorTop = top;
          } else {
            var ry = index === 0 ? 44 : 36;
            var rx = index === 0 ? 58 : 50;
            var cx = 100 + (index === 0 ? 0 : (index % 2 ? -7 : 6));
            var cy = index === 0 ? seat - ry + 20 : cursorTop + ry - 14;
            items.push({ type: "ball", flavor: scoop.flavor, cx: cx, cy: cy, rx: rx, ry: ry, top: cy - ry });
            cursorTop = cy - ry;
          }
        });
        return { seat: seat, items: items, top: cursorTop };
      }

      function holderMarkup(id, seat) {
        var tip = seat + 108;
        if (state.container === "cup") {
          return '<linearGradient id="' + id + 'cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe4ef"/></linearGradient>'
            + '<path d="M62 ' + (seat + 8) + " H138 L128 " + (seat + 92) + " Q100 " + (seat + 108) + " 72 " + (seat + 92) + ' Z" fill="url(#' + id + 'cup)" stroke="#f3b7cc" stroke-width="3"/>'
            + '<rect x="76" y="' + (seat + 28) + '" width="8" height="40" rx="4" fill="#fff" opacity="0.75"/>';
        }
        var clip = id + "clip";
        var d = "M46 " + (seat + 4) + " Q100 " + (seat - 10) + " 154 " + (seat + 4) + " L112 " + tip + " Q100 " + (tip + 10) + " 88 " + tip + " Z";
        var lines = "";
        var i;
        for (i = -40; i <= 220; i += 16) {
          lines += '<path d="M' + i + " " + (seat - 20) + " L" + (i + 70) + " " + (tip + 20) + '"/>';
          lines += '<path d="M' + (i + 70) + " " + (seat - 20) + " L" + i + " " + (tip + 20) + '"/>';
        }
        return '<linearGradient id="' + id + 'cone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6b0"/><stop offset="1" stop-color="#e08a34"/></linearGradient>'
          + '<clipPath id="' + clip + '"><path d="' + d + '"/></clipPath>'
          + '<path d="' + d + '" fill="url(#' + id + 'cone)"/>'
          + '<g clip-path="url(#' + clip + ')" stroke="#d0893c" stroke-width="2.2" opacity="0.55" fill="none">' + lines + "</g>"
          + '<ellipse cx="100" cy="' + seat + '" rx="56" ry="11" fill="#f6c56e"/>';
      }

      function rimMarkup(seat) {
        if (state.container !== "cup") return "";
        return '<rect x="54" y="' + (seat - 14) + '" width="92" height="22" rx="11" fill="#ffd5e6" stroke="#f0a9c4" stroke-width="3"/>';
      }

      function toppingMarkup(id, topY) {
        var html = "";
        if (state.toppings.indexOf("sauce") !== -1) {
          html += '<path d="M78 ' + (topY + 18) + " C86 " + (topY + 8) + " 114 " + (topY + 6) + " 126 " + (topY + 20)
            + " C120 " + (topY + 36) + " 116 " + (topY + 58) + " 112 " + (topY + 74)
            + " C108 " + (topY + 48) + " 102 " + (topY + 40) + " 98 " + (topY + 66)
            + " C92 " + (topY + 44) + " 84 " + (topY + 36) + " 78 " + (topY + 18) + ' Z" fill="#5c3317"/>';
        }
        if (state.toppings.indexOf("sprinkles") !== -1) {
          var bits = [[-28, 18, -24, "#ff5d8f"], [-8, 8, 18, "#ffd166"], [12, 14, -10, "#7bdff2"], [28, 24, 32, "#c77dff"], [-18, 32, 40, "#fff7ea"], [6, 34, -30, "#8ed96a"]];
          bits.forEach(function (b) {
            var x = 100 + b[0];
            var y = topY + b[1];
            html += '<rect x="' + x + '" y="' + y + '" width="7" height="15" rx="3.5" fill="' + b[3] + '" transform="rotate(' + b[2] + " " + (x + 3) + " " + (y + 7) + ')"/>';
          });
        }
        if (state.toppings.indexOf("cherry") !== -1) {
          html += '<path d="M108 ' + (topY + 6) + " C122 " + (topY - 18) + " 140 " + (topY - 28) + " 154 " + (topY - 34) + '" fill="none" stroke="#3aaa4a" stroke-width="3.5" stroke-linecap="round"/>'
            + '<ellipse cx="156" cy="' + (topY - 36) + '" rx="11" ry="5.5" fill="#8ed96a" transform="rotate(-28 156 ' + (topY - 36) + ')"/>'
            + '<circle cx="100" cy="' + (topY + 12) + '" r="15" fill="#ef3b55"/>'
            + '<ellipse cx="93" cy="' + (topY + 6) + '" rx="5" ry="3" fill="#fff" opacity="0.8"/>';
        }
        return html;
      }

      function treatMarkup() {
        if (!state.container) return "";
        var id = uid("t");
        var laid = layoutScoops();
        var body = holderMarkup(id, laid.seat);
        laid.items.forEach(function (item) {
          if (item.type === "swirl") body += swirlMarkup(id, item.flavor, item.base, item.top);
          else body += ballMarkup(id, item.flavor, item.cx, item.cy, item.rx, item.ry);
        });
        body += rimMarkup(laid.seat);
        var topY = laid.items.length ? laid.top : laid.seat - 20;
        body += toppingMarkup(id, topY);
        var viewTop = Math.min(topY, laid.seat) - (state.toppings.indexOf("cherry") !== -1 ? 52 : 16);
        var viewBottom = laid.seat + 128;
        var viewH = viewBottom - viewTop;
        return '<svg class="treat-svg" viewBox="0 ' + viewTop.toFixed(1) + " 200 " + viewH.toFixed(1) + '" aria-hidden="true">' + body + "</svg>";
      }

      function icon(kind) {
        var colors = scoopColors(kind);
        if (kind === "ball" || kind === "swirl" || colors) {
          if (kind === "cone") return '<svg viewBox="40 150 120 150" aria-hidden="true"><path d="M48 168 Q100 150 152 168 L114 286 Q100 298 86 286 Z" fill="#f0b15e" stroke="#d0893c" stroke-width="4"/></svg>';
          if (kind === "cup") return '<svg viewBox="48 150 104 140" aria-hidden="true"><path d="M66 176 H134 L124 250 Q100 264 76 250 Z" fill="#fff" stroke="#f3b7cc" stroke-width="3"/><rect x="56" y="160" width="88" height="22" rx="11" fill="#ffd5e6" stroke="#f0a9c4" stroke-width="3"/></svg>';
          if (kind === "swirl") return '<svg viewBox="40 20 120 180" aria-hidden="true"><path d="M70 150 C48 120 58 90 78 78 C58 64 66 36 90 24 C112 40 128 70 112 96 C140 112 136 148 100 156 C86 162 76 160 70 150 Z" fill="#ff8eab"/><path d="M96 140 C82 110 112 86 96 52" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.6"/><path d="M58 168 Q100 154 142 168 L118 210 Q100 220 82 210 Z" fill="#f0b15e"/></svg>';
          if (kind === "ball") return '<svg viewBox="30 40 140 180" aria-hidden="true"><ellipse cx="100" cy="108" rx="52" ry="40" fill="#ff8eab"/><ellipse cx="82" cy="92" rx="14" ry="8" fill="#fff" opacity="0.45"/><path d="M52 156 Q100 142 148 156 L116 214 Q100 226 84 214 Z" fill="#f0b15e"/></svg>';
          if (kind === "add") return '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="#fff6ea" stroke="#f0c49a" stroke-width="3"/><path d="M32 18 v28 M18 32 h28" stroke="#e56b8c" stroke-width="4" stroke-linecap="round"/></svg>';
          if (kind === "next" || kind === "finish") return '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="#ffe4ee"/><path d="M20 34 l8 8 16-18" fill="none" stroke="#e56b8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          if (kind === "cherry") return '<svg viewBox="70 28 100 90" aria-hidden="true"><path d="M108 70 C124 46 146 38 160 34" fill="none" stroke="#3aaa4a" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="84" r="18" fill="#ef3b55"/><ellipse cx="92" cy="76" rx="5" ry="3" fill="#fff" opacity="0.8"/></svg>';
          if (kind === "sauce") return '<svg viewBox="48 60 110 90" aria-hidden="true"><ellipse cx="100" cy="108" rx="46" ry="28" fill="#ffd0a8"/><path d="M70 96 C84 82 118 80 134 100 C124 112 116 126 108 140 C100 118 92 114 84 130 C76 112 68 106 70 96 Z" fill="#5c3317"/></svg>';
          if (kind === "sprinkles") return '<svg viewBox="48 60 110 90" aria-hidden="true"><ellipse cx="100" cy="108" rx="46" ry="28" fill="#ffd0a8"/><g><rect x="78" y="78" width="8" height="16" rx="4" fill="#ff5d8f" transform="rotate(-24 82 86)"/><rect x="104" y="72" width="8" height="16" rx="4" fill="#7bdff2" transform="rotate(16 108 80)"/><rect x="122" y="92" width="8" height="16" rx="4" fill="#ffd166" transform="rotate(32 126 100)"/></g></svg>';
          var paint = kind;
          if (state.pendingShape === "swirl") {
            return '<svg viewBox="30 10 140 150" aria-hidden="true"><defs>' + grad("ic" + kind, paint) + '</defs><path d="M70 120 C50 96 60 70 80 60 C62 48 70 24 92 16 C112 30 126 56 112 78 C136 92 132 122 100 128 C88 132 78 130 70 120 Z" fill="url(#ic' + kind + ')"/></svg>';
          }
          return '<svg viewBox="20 30 160 120" aria-hidden="true"><defs>' + grad("ic" + kind, paint) + '</defs><ellipse cx="100" cy="90" rx="58" ry="42" fill="url(#ic' + kind + ')"/><ellipse cx="78" cy="74" rx="16" ry="9" fill="#fff" opacity="0.4"/></svg>';
        }
        return "";
      }

      function choiceArt(group, id) {
        if (group === "color") return icon(id);
        if (group === "shape") return icon(id);
        if (group === "more" || group === "moreTop") return icon(id);
        return icon(id);
      }

      function ensureAudio() {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!ctx) ctx = new AC();
        if (ctx.state === "suspended") ctx.resume();
      }

      function mallet(freq, when, dur, vol) {
        if (!soundOn || !ctx) return;
        var osc = ctx.createOscillator();
        var body = ctx.createOscillator();
        var filter = ctx.createBiquadFilter();
        var gain = ctx.createGain();
        osc.type = "triangle";
        body.type = "sine";
        osc.frequency.setValueAtTime(freq, when);
        body.frequency.setValueAtTime(freq / 2, when);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1200, when);
        filter.Q.value = 0.6;
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(vol, when + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
        osc.connect(filter);
        body.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(when);
        body.start(when);
        osc.stop(when + dur + 0.04);
        body.stop(when + dur + 0.04);
      }

      function tapSound() {
        if (!ctx) return;
        var now = ctx.currentTime;
        mallet(659, now, 0.22, 0.05);
        mallet(784, now + 0.07, 0.24, 0.04);
      }

      function doneSound() {
        if (!ctx) return;
        var now = ctx.currentTime;
        [523, 659, 784, 880].forEach(function (freq, i) {
          mallet(freq, now + i * 0.14, 0.34, 0.055);
        });
      }

      function pickVoice() {
        var voices = window.speechSynthesis.getVoices();
        var prefer = ["Xiaoxiao", "Xiaoyi", "Yaoyao", "Huihui", "Yunxi", "Ting-Ting", "Meijia"];
        var i, j;
        for (i = 0; i < prefer.length; i++) {
          for (j = 0; j < voices.length; j++) {
            if (voices[j].name.indexOf(prefer[i]) !== -1) return voices[j];
          }
        }
        for (j = 0; j < voices.length; j++) {
          if (/zh[-_]CN/i.test(voices[j].lang)) return voices[j];
        }
        for (j = 0; j < voices.length; j++) {
          if (/zh/i.test(voices[j].lang)) return voices[j];
        }
        return null;
      }

      function speak(text) {
        if (!soundOn || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(text);
        utter.lang = "zh-CN";
        utter.rate = 0.9;
        utter.pitch = 1.15;
        var voice = pickVoice();
        if (voice) utter.voice = voice;
        window.speechSynthesis.speak(utter);
      }

      function currentChoices() {
        if (phase === "topping") {
          return groups.topping.filter(function (item) {
            return state.toppings.indexOf(item.id) === -1;
          });
        }
        return groups[phase] || [];
      }

      function applyChoice(id) {
        if (phase === "container") {
          state.container = id;
          phase = "shape";
        } else if (phase === "shape") {
          state.pendingShape = id;
          phase = "color";
        } else if (phase === "color") {
          state.scoops.push({ shape: state.pendingShape, flavor: id });
          state.pendingShape = null;
          phase = state.scoops.length >= MAX_SCOOPS ? "topping" : "more";
        } else if (phase === "more") {
          phase = id === "add" ? "shape" : "topping";
        } else if (phase === "topping") {
          if (state.toppings.indexOf(id) === -1) state.toppings.push(id);
          phase = state.toppings.length >= groups.topping.length ? "done" : "moreTop";
        } else if (phase === "moreTop") {
          phase = id === "add" ? "topping" : "done";
        }
      }

      function render() {
        var done = phase === "done";
        promptEl.textContent = looking ? "点一下屏幕" : promptFor(phase);
        bear.classList.toggle("is-happy", done);
        app.classList.toggle("is-looking", looking);
        var marker = phaseIndex(phase);
        dots.forEach(function (dot, i) {
          dot.classList.toggle("is-now", i === marker);
          dot.classList.toggle("is-done", i < marker);
        });

        treatEl.innerHTML = treatMarkup();
        treatEl.classList.toggle("is-done", done);

        choicesEl.hidden = done;
        choicesEl.classList.toggle("is-colors", phase === "color");
        choicesEl.innerHTML = "";
        if (!done) {
          currentChoices().forEach(function (item) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "choice";
            btn.setAttribute("data-id", item.id);
            btn.setAttribute("aria-label", item.label);
            btn.innerHTML = '<span class="art">' + choiceArt(phase, item.id) + "</span><span>" + item.label + "</span>";
            choicesEl.appendChild(btn);
          });
        }

        playFooter.hidden = done;
        doneFooter.hidden = !done;
        backBtn.hidden = history.length === 0;
        playFooter.classList.toggle("is-single", history.length === 0);
        lookBtn.hidden = looking;
        doneFooter.classList.toggle("is-single", looking);
      }

      function choose(id, btn) {
        if (busy || phase === "done") return;
        busy = true;
        ensureAudio();
        booted = true;
        if (btn) btn.classList.add("is-picked");
        tapSound();
        remember();
        applyChoice(id);
        speak(promptFor(phase));
        var finished = phase === "done";
        setTimeout(function () {
          busy = false;
          if (finished) doneSound();
          render();
        }, 180);
      }

      function resetAll() {
        phase = "container";
        state.container = null;
        state.pendingShape = null;
        state.scoops = [];
        state.toppings = [];
        history = [];
        looking = false;
        busy = false;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        render();
        if (booted) speak(promptFor(phase));
      }

      function back() {
        if (busy || !history.length || phase === "done") return;
        restore(history.pop());
        render();
        if (booted) speak(promptFor(phase));
      }

      choicesEl.addEventListener("click", function (event) {
        var btn = event.target.closest(".choice");
        if (!btn) return;
        choose(btn.getAttribute("data-id"), btn);
      });

      backBtn.addEventListener("click", function () {
        ensureAudio();
        booted = true;
        back();
      });
      resetBtn.addEventListener("click", function () {
        ensureAudio();
        booted = true;
        resetAll();
      });
      againBtn.addEventListener("click", function () {
        ensureAudio();
        booted = true;
        resetAll();
      });
      lookBtn.addEventListener("click", function () {
        looking = true;
        render();
      });

      app.addEventListener("pointerdown", function (event) {
        if (event.target.closest("a, button")) return;
        ensureAudio();
        if (looking) {
          looking = false;
          render();
          return;
        }
        if (!booted) {
          booted = true;
          speak(promptFor(phase));
        }
      });

      soundBtn.addEventListener("click", function () {
        soundOn = !soundOn;
        soundBtn.classList.toggle("is-off", !soundOn);
        soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
        soundBtn.setAttribute("aria-label", soundOn ? "声音开" : "声音关");
        if (!soundOn && window.speechSynthesis) window.speechSynthesis.cancel();
        if (soundOn) {
          ensureAudio();
          booted = true;
          speak(looking ? "做好啦" : promptFor(phase));
        }
      });

      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = function () {};
      }

      render();
    })();
  </script>
</body>
</html>
